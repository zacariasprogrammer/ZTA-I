name: Deploy ZTA I to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check game JS syntax
        run: |
          python3 -c "import re; html=open('index.html').read(); blocks=re.findall(r'<script>(.*?)</script>', html, re.S); [open('/tmp/game%d.js'%i,'w').write(b) for i,b in enumerate(blocks)]; print('inline script blocks:', len(blocks))"
          for f in /tmp/game*.js; do node --check "$f"; done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
